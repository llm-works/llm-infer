[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools-scm>=8.0,<9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-infer"
dynamic = ["version"]
description = "Multi-backend LLM client library, a from-scratch PagedAttention inference engine, and an OpenAI-compatible serve wrapper."
license = "Apache-2.0"
authors = [{name = "LLM Works LLC", email = "info@llm-works.ai"}]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Minimal base for LLMClient with OpenAI-compatible backends
    # Use [client] for all backends, [runtime]/[cuda] for serving
    "appinfra>=0.12.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    # Security: explicitly pin transitive dependencies for CVE fixes
    "aiohttp>=3.13.3,<4.0.0",
    "filelock>=3.20.1,<4.0.0",
    "urllib3>=2.6.3,<3.0.0",
    "werkzeug>=3.1.5,<4.0.0",
]

[project.optional-dependencies]
# Anthropic: native Claude API backend
anthropic = [
    "anthropic>=0.47.0,<1.0.0",
]
# SAIA: llm-saia verb vocabulary adapter
saia = [
    "llm-saia>=0.6.0",
]
# Embedding: token counting for OpenAI embeddings
embedding = [
    "tiktoken>=0.7.0,<1.0.0",
]
# GCP: service-account auth for Vertex AI (chat + embedding backends)
gcp = [
    "google-auth>=2.0.0,<3.0.0",
]
# Client: all client backends (anthropic + saia + embedding + gcp)
client = [
    "llm-infer[anthropic]",
    "llm-infer[saia]",
    "llm-infer[embedding]",
    "llm-infer[gcp]",
]
# Runtime: CPU serving (includes FastAPI)
runtime = [
    "appinfra[fastapi]>=0.12.0",
    "torch>=2.0.0,<3.0.0",
    "transformers>=5.10.4,<6.0.0",
    "safetensors>=0.4.0,<1.0.0",
    "peft>=0.21.0,<1.0.0",
]
# CUDA: GPU serving with vLLM (includes runtime)
cuda = [
    "llm-infer[runtime]",
    "vllm>=0.30.0,<1.0.0",
    "flashinfer-python>=0.2.0,<1.0.0",
    "pynvml>=11.0.0,<13.0.0",
]
# All: everything
all = [
    "llm-infer[client]",
    "llm-infer[cuda]",
]
dev = [
    "coverage>=7.0.0,<8.0.0",
    "ruff>=0.1.0,<1.0.0",
    "mypy>=1.0.0,<2.0.0",
    "types-PyYAML>=6.0.0",
    "pytest>=7.0.0,<10.0.0",
    "pytest-asyncio>=0.21.0,<2.0.0",
    "pytest-cov>=4.0.0,<8.0.0",
    "pytest-xdist>=3.0.0,<4.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "C90",   # mccabe complexity
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "PIE",   # flake8-pie
    "PERF",  # perflint
    "FURB",  # refurb
    "C4",    # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["llm_infer"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["llm_infer/examples/"]

# ML stack: not analysed, its imports are Any. vllm, flashinfer and pynvml need
# CUDA and don't install on the CI runner, and analysing torch/transformers ties
# the check to their annotations across our wide version ranges. Skipped the same
# way locally and in CI, so both give the same verdict. pynvml has no types at all;
# numpy >= 2.5 stubs use 3.12 `type` statements, which mypy rejects under
# python_version 3.11 (llm_infer never imports numpy, its dependencies do).
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "vllm.*",
    "flashinfer.*",
    "safetensors.*",
    "peft.*",
    "tokenizers.*",
    "pynvml.*",
    "numpy.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
pythonpath = ["."]
markers = [
    "unit: Unit tests (fast, isolated, mocked dependencies)",
    "integration: Integration tests (real dependencies)",
    "e2e: End-to-end tests (full system workflows)",
    "perf: Performance tests (benchmarks, load tests)",
    "security: Security tests (injection, validation, XSS)",
]

[tool.coverage.run]
source = ["llm_infer"]
omit = ["*/test/*", "*/tests/*", "*_test.py"]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[project.scripts]
llm-infer = "llm_infer.cli.cli:main"

[tool.setuptools_scm]
# Version derived from git tags (e.g., v0.1.0 -> 0.1.0)
# Fallback for builds without git (e.g., Docker)
fallback_version = "0.0.0.dev0"

[tool.setuptools.package-data]
llm_infer = [
    "py.typed",
    "etc/*.yaml",
    "etc/README.md",
    "examples/**/*.yaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_infer*"]
exclude = ["tests*", "scripts*", "docs*", "examples*", "etc*"]
