name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy types-PyYAML
          python -m pip install "appinfra @ git+https://github.com/llm-works/appinfra.git@develop"

      - name: Check SPDX headers
        run: python -m appinfra.cli.cli -l error cq spdx

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy llm_infer/ --ignore-missing-imports

  test:
    name: Test ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only torch first to avoid CUDA dependencies
          # Use --extra-index-url to keep PyPI for torch's deps (networkx, etc.)
          python -m pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          # Install appinfra from GitHub (need unreleased FastAPI subprocess logger injection)
          python -m pip install "appinfra[fastapi] @ git+https://github.com/llm-works/appinfra.git@develop"
          # python -m pip install "appinfra>=0.4.0,<0.5.0"  # switch back after next appinfra release
          # Install llm-saia from GitHub (need core public API re-exports)
          python -m pip install "llm-saia @ git+https://github.com/llm-works/llm-saia.git@develop"
          # python -m pip install "llm-saia>=0.2.0,<0.3.0"  # switch back after next llm-saia release
          # Install package with dev, runtime, saia, and gcp extras
          python -m pip install -e ".[dev,runtime,saia,gcp]"

      - name: Run unit tests
        run: python -m pytest tests/ -m unit -v --tb=short

      - name: Run integration tests
        # In-process integration coverage — real mp.Process spawn and
        # cross-process IPC (no external services). Guards the Py3.14
        # forkserver pickle boundary in serve subprocess startup.
        run: python -m pytest tests/ -m integration -v --tb=short

  ollama-smoke-test:
    name: Ollama E2E
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        options: >-
          --health-cmd "ollama list || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel + appinfra
        run: |
          # Install the built wheel (not editable) so bundled package-data
          # (etc/) is exercised the same way a `pip install llm-infer` user
          # would hit it. Ollama engine talks HTTP — no torch needed.
          python -m pip install ./dist/*.whl \
            "appinfra[fastapi] @ git+https://github.com/llm-works/appinfra.git@develop"
          # python -m pip install "appinfra>=0.4.0,<0.5.0"  # switch back after next appinfra release

      - name: Verify client-library imports on base install
        # cd out of the source tree so `import llm_infer` resolves to the
        # installed wheel, not the local llm_infer/ directory.
        working-directory: /tmp
        run: |
          python -c "from llm_infer.client import Factory, FallbackClient, LLMRouter, EmbeddingClient; import llm_infer; print('llm_infer', llm_infer.__version__)"

      - name: Pull Ollama model
        run: |
          # Use ollama CLI (blocking) instead of async curl to ensure model is ready
          docker exec $(docker ps -q --filter ancestor=ollama/ollama:latest) ollama pull qwen2.5:0.5b
          curl http://localhost:11434/api/tags | jq .

      - name: Start llm-infer server
        # No --etc-dir: exercises the bundled etc/ default shipped in the
        # wheel — the same path a first-time `pip install llm-infer` user
        # hits (regression coverage for the FileNotFoundError class of bug).
        run: |
          llm-infer serve --model qwen2.5:0.5b &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in {1..60}; do
            if curl -s http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/60)"
            sleep 2
          done
          # Fail explicitly if server never became healthy
          if ! curl -s http://localhost:8000/health | grep -q '"status":"ok"'; then
            echo "ERROR: Server failed to start within 120 seconds"
            exit 1
          fi

      - name: Run client quickstart against live serve
        # cd out of the source tree so `llm_infer.examples.quickstart`
        # resolves to the installed wheel, not the local llm_infer/
        # directory — same as the client-library import verify step.
        working-directory: /tmp
        env:
          LLM_INFER_BASE_URL: http://localhost:8000/v1
          LLM_INFER_MODEL: qwen2.5:0.5b
          LLM_INFER_PROMPT: Say hello in exactly 3 words
          LLM_INFER_MAX_TOKENS: '20'
        run: python -m llm_infer.examples.quickstart

      - name: Cleanup
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi

  test-summary:
    name: Test
    runs-on: ubuntu-latest
    needs: [test, ollama-smoke-test]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.ollama-smoke-test.result }}" != "success" ]]; then
            echo "Ollama smoke test failed"
            exit 1
          fi
          echo "All tests passed"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only torch first to avoid CUDA dependencies
          # Use --extra-index-url to keep PyPI for torch's deps (networkx, etc.)
          python -m pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          # Install appinfra from GitHub (need unreleased FastAPI subprocess logger injection)
          python -m pip install "appinfra[fastapi] @ git+https://github.com/llm-works/appinfra.git@develop"
          # python -m pip install "appinfra>=0.4.0,<0.5.0"  # switch back after next appinfra release
          # Install llm-saia from GitHub (need core public API re-exports)
          python -m pip install "llm-saia @ git+https://github.com/llm-works/llm-saia.git@develop"
          # python -m pip install "llm-saia>=0.2.0,<0.3.0"  # switch back after next llm-saia release
          # Install package with dev, runtime, saia, and gcp extras
          python -m pip install -e ".[dev,runtime,saia,gcp]"

      - name: Run tests with coverage
        run: python -m pytest tests/ -m unit --cov=llm_infer --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
